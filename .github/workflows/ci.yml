name: Python CI

on:
  push:
  pull_request:


permissions:
  content: read

jobs:
  test:
    runs-on: ubuntu-latest


      steps:
        - name: Check out Repository
          uses: actions/checkout@v6

        - name: Set up Python
          uses: action/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install development dependencies
          run: python -m pip install -r requirement-dev.txt

        - name: Run tests
          run: python -m pytest -q